system:
  update_loop_hz: 50
  heartbeat_timeout_sec: 1.0
  ai_engine: "hailo_8l"

pins:
  gpio_chip: "/dev/gpiochip4"
  motor_left_dir: 17
  motor_left_pwm: 12
  motor_right_dir: 27
  motor_right_pwm: 13
  payload_servo_pwm: 18

rover_drive:
  max_pwm_duty: 100
  min_pwm_duty: 10
  steering_deadzone: 0.05
  accel_slew_rate: 2.5
  emergency_brake_dist_cm: 20.0
  warning_dist_cm: 50.0

drone_flight:
  max_altitude_m: 15.0
  max_horizontal_speed_mps: 3.0
  max_climb_rate_mps: 1.5
  rtl_altitude_m: 5.0
  pid_gains:
    kp: 1.2
    ki: 0.05
    kd: 0.3

flight_stack:
  serial_port: "/dev/ttyAMA0"
  baudrate: 921600

# NEW: Cellular / eSIM Configuration for Robot & Watch
cellular:
  enabled: true
  apn: "iot.econnect.com"
  modem_port: "/dev/ttyUSB2"
  baudrate: 115200
  fallback_timeout_sec: 5.0
  cloud_mqtt_broker: "mqtt.guardian-ecosystem.io"
  cloud_mqtt_port: 8883

control_web:
  host: "0.0.0.0"
  port: 8080
  websocket_endpoint: "/ws/ecosystem"
  auth_token: "gx1-secure-mesh-2026"
  devices:
    - "robot_core"
    - "smartwatch"
    - "smart_glasses"
    - "mobile_client"
    - "laptop_client"

memory_manager:
  check_interval_sec: 5.0
  ram_critical_threshold_percent: 85.0
  target_free_ram_mb: 1500
  enable_linux_drop_caches: true
  protected_processes:
    - "python3"
    - "state_machine"
    - "web_server"

voice_ai:
  model_name: "llama3.2:3b"
  stt_model: "base.en"
  ollama_url: "http://localhost:11434"
